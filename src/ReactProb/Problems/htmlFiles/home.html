<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>React Components - Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 10px; text-align: center; }
        p.subtitle { color: #666; text-align: center; margin-bottom: 30px; }
        .card-list { display: flex; flex-direction: column; gap: 15px; }
        a.card {
            display: block;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }
        a.card:hover {
            background: #667eea;
            color: #fff;
            transform: translateX(5px);
        }
        a.card h3 { margin-bottom: 5px; }
        a.card small { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚛️ React Components</h1>
        <p class="subtitle">Click any component to run it</p>
        <div class="card-list">
            <a class="card" href="index.html">
                <h3>📊 Counter App</h3>
                <small>Increment, decrement, and reset a number counter</small>
            </a>
            <a class="card" href="toggle.html">
                <h3>🔘 Toggle Component</h3>
                <small>ON/OFF switch with toggle counter</small>
            </a>
        </div>
    </div>
</body>
</html>
